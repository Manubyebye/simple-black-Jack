<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazing Blackjack</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>Blackjack</h1>
            <div class="bank-info">
                <p>Bank: $<span id="bankroll">1000</span></p>
                <p>Bet: $<span id="current-bet">0</span></p>
            </div>
        </header>

        <div class="game-board">
            <div class="hand-area" id="dealer-area">
                <h2>Dealer's Hand: <span id="dealer-score">0</span></h2>
                <div id="dealer-hand" class="hand">
                    </div>
            </div>

            <div id="message-overlay" class="hidden">
                <p id="message-text"></p>
                <button id="play-again-button">Play Again</button>
            </div>

            <div class="hand-area" id="player-area">
                <h2>Your Hand: <span id="player-score">0</span></h2>
                <div id="player-hand" class="hand">
                    </div>
            </div>
        </div>

        <div class="controls">
            <div id="betting-controls">
                <label for="bet-amount">Bet Amount:</label>
                <input type="number" id="bet-amount" value="50" min="10">
                <button id="bet-button">Place Bet</button>
            </div>
            
            <div id="action-controls" class="hidden">
                <button id="hit-button">Hit</button>
                <button id="stand-button">Stand</button>
            </div>
        </div>
        
    </div>

    <script src="index.js"></script>
</body>
</html>
